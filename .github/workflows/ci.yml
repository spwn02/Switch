name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gcc16:
    runs-on: ubuntu-latest
    container: gcc:16
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ninja-build python3 python3-venv
          python3 -m venv /opt/cmake
          /opt/cmake/bin/pip install --no-cache-dir cmake==4.4.2
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          cmake --version
          g++ --version
          ninja --version

      - name: Self-tests and examples
        run: |
          cmake --preset tests --fresh
          cmake --build --preset tests
          ctest --preset tests

      - name: add_subdirectory consumer
        run: |
          cmake -S tests/consumer/add-subdirectory -B build/consumer-add -G Ninja \
            -DSWITCH_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build/consumer-add
          ./build/consumer-add/switch_consumer

      - name: FetchContent consumer
        run: |
          cmake -S tests/consumer/fetch-content -B build/consumer-fetch -G Ninja \
            -DFETCHCONTENT_SOURCE_DIR_SWITCH="$GITHUB_WORKSPACE"
          cmake --build build/consumer-fetch
          ./build/consumer-fetch/switch_consumer

      - name: Installed-package consumer
        run: |
          cmake --preset release --fresh
          cmake --build --preset release
          cmake --install build/release --prefix "$GITHUB_WORKSPACE/build/install"
          cmake -S tests/consumer/find-package -B build/consumer-package -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install"
          cmake --build build/consumer-package
          ./build/consumer-package/switch_consumer
