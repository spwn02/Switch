name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CXX26_SNAPSHOT: cxx26-2026.09.05
  CXX26_REVISION: 6c7ef6afbfd8456c964c7a2625b3ea2aaa7d613f
  CXX26_ASSET: clang-cxx26-2026.09.05-linux-x86_64
  MIRACLE_REVISION: b16bcb4672957060d3b99e036e7532ee2bd0fcf6

jobs:
  reference:
    name: Reference C++26 (cxx26-2026.09.05)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl gh ninja-build python3 python3-venv zstd

          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --no-cache-dir cmake==4.4.2
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Install pinned reference toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          download_dir="$RUNNER_TEMP/cxx26-download"
          install_dir="$RUNNER_TEMP/cxx26-install"

          mkdir -p "$download_dir" "$install_dir"

          gh release download "$CXX26_SNAPSHOT" \
            --repo spwn02/clang-cxx26 \
            --pattern "${CXX26_ASSET}.tar.zst" \
            --pattern "${CXX26_ASSET}.manifest.json" \
            --pattern "${CXX26_ASSET}.SHA256SUMS" \
            --dir "$download_dir"

          (
            cd "$download_dir"
            sha256sum --check "${CXX26_ASSET}.SHA256SUMS"
          )

          python3 - \
            "$download_dir/${CXX26_ASSET}.manifest.json" \
            "$CXX26_SNAPSHOT" \
            "$CXX26_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest_path = Path(sys.argv[1])
          expected_snapshot = sys.argv[2]
          expected_revision = sys.argv[3]

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["snapshot"] == expected_snapshot, (
              manifest["snapshot"],
              expected_snapshot,
          )
          assert manifest["source"]["revision"] == expected_revision, (
              manifest["source"]["revision"],
              expected_revision,
          )
          assert manifest["source"]["repository"] == "https://github.com/spwn02/clang-cxx26"
          assert manifest["source"]["branch"] == "cxx26"
          assert manifest["compiler"]["name"] == "clang-cxx26"
          assert manifest["platform"]["os"] == "linux"
          assert manifest["platform"]["architecture"] == "x86_64"
          assert manifest["cmake"]["minimumConsumerVersion"] == "4.4"
          assert manifest["cmake"]["toolchainFile"] == "share/clang-cxx26/toolchain.cmake"
          PY

          tar \
            --use-compress-program=unzstd \
            -xf "$download_dir/${CXX26_ASSET}.tar.zst" \
            -C "$install_dir"

          toolchain_root="$install_dir/clang-${CXX26_SNAPSHOT}"
          test -x "$toolchain_root/bin/clang++"
          test -x "$toolchain_root/bin/clangd"
          test -f "$toolchain_root/share/clang-cxx26/toolchain.cmake"
          test -f "$toolchain_root/share/clang-cxx26/activate.sh"

          cmp \
            "$download_dir/${CXX26_ASSET}.manifest.json" \
            "$toolchain_root/share/clang-cxx26/manifest.json"

          # shellcheck disable=SC1090
          source "$toolchain_root/share/clang-cxx26/activate.sh"

          {
            echo "CXX26_TOOLCHAIN_ROOT=$CXX26_TOOLCHAIN_ROOT"
            echo "CXX26_CMAKE_TOOLCHAIN_FILE=$CXX26_CMAKE_TOOLCHAIN_FILE"
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

          echo "$CXX26_TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          "$CXX" --version
          ninja --version

      - name: Self-tests and examples
        shell: bash
        run: |
          set -euo pipefail

          cmake --preset tests --fresh \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE" \
            -DSWITCH_MIRACLE_FETCHCONTENT_TAG="$MIRACLE_REVISION"
          cmake --build --preset tests
          ctest --preset tests

      - name: add_subdirectory consumer
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S tests/consumer/add-subdirectory \
            -B build/consumer-add \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE" \
            -DSWITCH_MIRACLE_FETCHCONTENT_TAG="$MIRACLE_REVISION" \
            -DSWITCH_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build/consumer-add
          ./build/consumer-add/switch_consumer

      - name: FetchContent consumer
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S tests/consumer/fetch-content \
            -B build/consumer-fetch \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE" \
            -DSWITCH_MIRACLE_FETCHCONTENT_TAG="$MIRACLE_REVISION" \
            -DFETCHCONTENT_SOURCE_DIR_SWITCH="$GITHUB_WORKSPACE"
          cmake --build build/consumer-fetch
          ./build/consumer-fetch/switch_consumer

      - name: Installed-package consumer
        shell: bash
        run: |
          set -euo pipefail

          cmake --preset release --fresh \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE" \
            -DSWITCH_MIRACLE_FETCHCONTENT_TAG="$MIRACLE_REVISION"
          cmake --build --preset release
          cmake --install build/release --prefix "$GITHUB_WORKSPACE/build/install"

          cmake \
            -S tests/consumer/find-package \
            -B build/consumer-package \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install"
          cmake --build build/consumer-package
          ./build/consumer-package/switch_consumer
